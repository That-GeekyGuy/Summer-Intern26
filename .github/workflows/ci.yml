name: ci
on:
  push:
    branches: ["**"]
    paths:
      - "Bess_Upf_AI/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Bess_Upf_AI/**"
      - ".github/workflows/ci.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [analysis, upf-sim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build + vet + test
        working-directory: Bess_Upf_AI/${{ matrix.svc }}
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [pipeline, serve, mitigation, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check ${{ matrix.svc }}
        working-directory: Bess_Upf_AI
      - name: install deps + test
        if: matrix.svc != 'tools'
        # pipeline/mitigation import as packages (e.g. `from pipeline.window
        # import ...`) so pytest must run one level up with PYTHONPATH=.;
        # serve's tests self-insert their own path and also work from here.
        working-directory: Bess_Upf_AI
        env:
          PYTHONPATH: .
        run: |
          pip install -r ${{ matrix.svc }}/requirements.txt
          pip install pytest
          pytest ${{ matrix.svc }}/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build
        working-directory: Bess_Upf_AI/frontend
        run: |
          npm ci
          npm run build
