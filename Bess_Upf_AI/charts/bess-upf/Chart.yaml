apiVersion: v2
name: bess-upf
description: BESS-UPF v2 stack — Phase 4a k8s/Helm baseline
version: 0.1.0
appVersion: "phase4a"
dependencies:
  - name: redpanda
    version: "0.1.0"
  - name: clickhouse
    version: "0.1.0"
  - name: serve
    version: "0.1.0"
  - name: pipeline
    version: "0.1.0"
  - name: mitigation
    version: "0.1.0"
  - name: ingress-nginx
    version: "4.11.3"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled
  - name: frontend
    version: "0.1.0"
  - name: upf-sim
    version: "0.1.0"
    condition: upf-sim.enabled
  - name: analysis
    version: "0.1.0"
  - name: chronos
    version: "0.1.0"
