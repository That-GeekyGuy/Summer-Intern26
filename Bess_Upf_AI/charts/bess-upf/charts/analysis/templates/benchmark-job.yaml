apiVersion: batch/v1
kind: Job
metadata:
  name: generate-benchmark-report
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: generate-benchmark-report
    spec:
      containers:
        - name: ablation
          image: "{{ .Values.registry }}/bess-upf-tools:{{ .Values.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/run.sh"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: script
              mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: models
          hostPath:
            path: /models
        - name: script
          configMap:
            name: generate-benchmark-script
            defaultMode: 0755
