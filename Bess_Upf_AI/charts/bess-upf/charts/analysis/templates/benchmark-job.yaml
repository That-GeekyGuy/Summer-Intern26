apiVersion: batch/v1
kind: Job
metadata:
  name: generate-benchmark-report
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: generate-benchmark-report
    spec:
      containers:
        - name: ablation
          image: "{{ .Values.registry }}/bess-upf-tools:{{ .Values.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/run.sh"]
          # /models is a hostPath mount owned by whatever host user set it up
          # (e.g. via tools/train/train.py run locally) — every other consumer
          # (chronos, ray) mounts it readOnly, but this job writes new dataset/
          # report files into it, so it needs to bypass that host-owned ACL
          # rather than guess the host UID.
          securityContext:
            runAsUser: 0
          env:
            # Tier 2b downloads MOMENT-1-large (+ its flan-t5-large backbone)
            # from HuggingFace. Without this, the cache defaults to $HOME
            # inside the container, which is wiped on every fresh pod (this
            # is a Helm hook — a new pod every install/upgrade, and again on
            # every backoffLimit retry), so the multi-hundred-MB-to-GB
            # download repeats every single run and is the dominant cause of
            # this job blowing past helm's --timeout. /models is the one
            # mount that's actually persistent across pod restarts, so
            # pointing the cache there makes every run after the first one
            # fast, and lets huggingface_hub resume a partial download across
            # backoff retries within the same run instead of restarting cold.
            - name: HF_HOME
              value: /models/.hf-cache
          volumeMounts:
            - name: models
              mountPath: /models
            - name: script
              mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: models
          hostPath:
            path: /models
        - name: script
          configMap:
            name: generate-benchmark-script
            defaultMode: 0755
