apiVersion: batch/v1
kind: Job
metadata:
  name: generate-benchmark-report
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: generate-benchmark-report
    spec:
      containers:
        - name: ablation
          image: "{{ .Values.registry }}/bess-upf-tools:{{ .Values.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/run.sh"]
          # /models is a hostPath mount owned by whatever host user set it up
          # (e.g. via tools/train/train.py run locally) — every other consumer
          # (chronos, ray) mounts it readOnly, but this job writes new dataset/
          # report files into it, so it needs to bypass that host-owned ACL
          # rather than guess the host UID.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: models
              mountPath: /models
            - name: script
              mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: models
          hostPath:
            path: /models
        - name: script
          configMap:
            name: generate-benchmark-script
            defaultMode: 0755
