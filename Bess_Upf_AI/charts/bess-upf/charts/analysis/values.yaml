namespace: bess-upf
registry: ghcr.io/that-geekyguy
tag: phase4a
imagePullSecret: ghcr-pull-secret
replicas: 1

# Gates all /api/v1/* routes. Override via .env (ANALYSIS_AUTH_USER/PASSWORD).
authUser: admin
authPassword: bess_admin

# Internal service URLs — only change if renaming the corresponding Kubernetes Service.
vllmUrl: http://vllm:8000
simUrl: http://upf-sim:8090

vllm:
  mock:
    enabled: true
  image: "vllm/vllm-openai:v0.4.3"
  model: "Qwen/Qwen2.5-7B-Instruct-AWQ"
  quantization: "awq"
  maxModelLen: 2048
  gpuMemoryUtilization: 0.8
  hfTokenSecretName: "hf-token"
  resources:
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
