apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
    - name: keeper
      port: 9181
    - name: keeper-raft
      port: 9234
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
