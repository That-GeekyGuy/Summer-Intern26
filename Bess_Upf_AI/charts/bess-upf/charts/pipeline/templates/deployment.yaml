apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: pipeline
  template:
    metadata:
      annotations:
        {{- if .Values.global.security.mtls.enabled }}
        linkerd.io/inject: enabled
        {{- end }}
      labels:
        app: pipeline
    spec:
      {{- if .Values.global.security.rbac.enabled }}
      serviceAccountName: pipeline
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: pipeline
          image: "{{ .Values.registry }}/bess-upf-pipeline:{{ .Values.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              value: {{ .Values.kafkaBroker | default "redpanda:9092" | quote }}
            - name: RAY_SERVE_URL
              value: {{ .Values.rayServeUrl | default "http://serve:8000" | quote }}
            - name: BYTEWAX_CHECKPOINT_DIR
              value: /data/bytewax-checkpoint
            - name: SCRAPE_INTERVAL_SECS
              value: {{ .Values.scrapeIntervalSecs | default "1.0" | quote }}
            - name: UPF_SIM_METRICS
              value: {{ .Values.metricsUrl | default "http://upf-sim:8090/metrics" | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
            - name: CLICKHOUSE_DSN
              value: http://chuser:$(CLICKHOUSE_PASSWORD)@clickhouse:8123/bess_upf
            - name: CHRONOS_URL
              value: {{ .Values.chronosUrl | default "http://chronos:8084" | quote }}
            - name: FORECAST_CHECK_INTERVAL_SECS
              value: {{ .Values.forecastCheckIntervalSecs | default "60" | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
