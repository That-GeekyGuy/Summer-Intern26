apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: {{ .Values.namespace }}
spec:
  serviceName: redpanda-headless
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      initContainers:
        - name: wait-for-peer-dns
          image: {{ .Values.image }}
          command: ["bash", "-c"]
          args:
            - |
              set -e
              # redpanda's internal DNS client (c-ares) resolves peer seed
              # hostnames exactly once at process start. All 3 pods start in
              # parallel (podManagementPolicy: Parallel), so each one's very
              # first c-ares lookup for its siblings can race the sibling's
              # DNS record actually propagating — c-ares then appears to
              # negative-cache that failure forever (confirmed: "error C-Ares:4
              # ... Not found" persisted indefinitely in logs, on hostnames
              # that `getent hosts` — the OS resolver — always resolved
              # successfully when checked after the fact; a trailing-dot FQDN
              # made no difference, ruling out an ndots-heuristic mismatch).
              # This init container waits for all 3 peers to resolve via the
              # OS resolver first, so redpanda's own first lookup never hits
              # the race.
              for peer in redpanda-0 redpanda-1 redpanda-2; do
                until getent hosts "${peer}.redpanda-headless.{{ .Values.namespace }}.svc.cluster.local"; do
                  echo "waiting for DNS: ${peer}"; sleep 2
                done
              done
      containers:
        - name: redpanda
          image: {{ .Values.image }}
          command: ["bash", "-c"]
          args:
            - |
              set -e
              # The raw `redpanda` binary only accepts --redpanda-cfg (verified via
              # `redpanda --help` in-cluster); `redpanda start ...` is not a valid
              # invocation on this image. rpk is the correct wrapper CLI. node_id
              # isn't an rpk flag or -X config-opt either — it auto-assigns from
              # the seed/cluster-join process, so it's intentionally omitted.
              # rpk's dev-mode auto-adds --reserve-memory/--overprovisioned itself
              # (confirmed via container logs) — repeating those after -- crashed
              # with "cannot be specified more than once". --smp/--memory are NOT
              # auto-added though, and without --smp 1 redpanda tries to grab
              # AIO slots for every host CPU and exceeds fs.aio-max-nr on this
              # kind node — so only those two are re-added here.
              # Every node lists ALL seeds (not just redpanda-0) — this is
              # the documented Redpanda multi-node bootstrap pattern. Pointing
              # every replica at only redpanda-0 let it self-bootstrap alone as
              # a single-node "leader" before 1/2 tried to join via a separate,
              # less-supported path, which reproducibly got stuck as permanent
              # raft learners (never promoted to voters, confirmed via repeated
              # "no leader controller elected" / stuck learner status in logs
              # on TWO separate fresh clusters, ruling out env flakiness).
              exec rpk redpanda start \
                --seeds "redpanda-0.redpanda-headless.{{ .Values.namespace }}.svc.cluster.local:33145,redpanda-1.redpanda-headless.{{ .Values.namespace }}.svc.cluster.local:33145,redpanda-2.redpanda-headless.{{ .Values.namespace }}.svc.cluster.local:33145" \
                --kafka-addr internal://0.0.0.0:9092 \
                --advertise-kafka-addr internal://$(hostname -f):9092 \
                --rpc-addr 0.0.0.0:33145 \
                --advertise-rpc-addr $(hostname -f):33145 \
                -- --smp 1 --memory 1G
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 33145
              name: rpc
            - containerPort: 9644
              name: admin
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "health"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
