apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-ml-models
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: deploy-ml-models
    spec:
      containers:
        - name: deployer
          image: "{{ .Values.registry }}/bess-upf-serve:{{ .Values.tag }}"
          imagePullPolicy: IfNotPresent
          # deploy_models.py must run inside the cluster's own Ray runtime
          # (ray job submit) — running it as a bare pod command only sets
          # RAY_ADDRESS and never actually attaches, so it silently deploys
          # to a throwaway local Ray instance that vanishes with the pod.
          command:
            - ray
            - job
            - submit
            - --address=http://bess-upf-serve-head-svc:8265
            - --working-dir
            - /app
            - --
            - python
            - deploy_models.py
      restartPolicy: OnFailure
