apiVersion: apps/v1
kind: Deployment
metadata:
  name: upf-sim
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: upf-sim
  template:
    metadata:
      labels:
        app: upf-sim
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: upf-sim
          image: "{{ .Values.registry }}/bess-upf-upf-sim:{{ .Values.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
