# Detection rule configuration for the upf-detector service.
#
# ORPHANED: this file describes the pre-V2, docker-compose-based architecture
# (a standalone "detection" service polling Prometheus/PromQL). The current
# V2 deployment (charts/bess-upf/*) has no such service — see
# analysis/docs/upf-runbook.md. It is not mounted or read by anything live.
# The `forecast.targets[*]` section below is kept in sync with
# frontend/src/features/forecast/ForecastPage.tsx's FORECAST_METRICS purely
# as documentation for whoever eventually builds the real predictive tier
# (see plan phase D) — it is not itself consumed anywhere yet.
#
# Simulator scale — this dev cluster's actual upf-sim (single node, Go env
# vars BASE_SESSIONS/BYTES_PER_SESSION/SPIKE_MULTIPLIER, not the SIM_* names
# below, which belonged to a different, older simulator):
#   BASE_SESSIONS=12000        → diurnal ±30%, jitter ±2%: ~8.2k–15.9k normal
#   BYTES_PER_SESSION=1000     → N3 rx baseline ~9.9-19.1 MB/s
#   SPIKE_MULTIPLIER=4.0       → ~48k sessions typical spike, ~64k worst-case
#                                 (diurnal peak coinciding with a spike)

polling_interval: 60s
window: 30m   # rolling window used by zscore and trend rules

metrics:

  # PFCP session count — primary capacity metric.
  # sim baseline: ~1M sessions (10 lakhs, diurnal ±30%); session_spike 4×: ~4M (40 lakhs)
  - name: pfcp_sessions_total
    selector: '{job="upf"}'
    rules:
      zscore:
        enabled: true
        threshold: 2.5       # 4× spike ≈ z-score > 100 vs baseline; fires on first spike sample
        severity: high
      trend:
        enabled: true
        deviation_threshold: 0.20
        severity: medium
      threshold:
        max: 2000000          # 20 lakhs per node; spike hits 40 lakhs → critical fires early
        severity: critical

  # Per-interface byte throughput — counter (bytes/s rate via rate()).
  # sim: N3 rx ≈ 6 GB/s baseline; session_spike → 24 GB/s
  - name: port_bytes_count
    selector: '{job="upf"}'
    rules:
      zscore:
        enabled: true
        threshold: 2.5
        severity: high
      trend:
        enabled: true
        deviation_threshold: 0.25
        severity: medium

  # Per-interface packet drop rate — counter (drops/s rate via rate()).
  # packet_drop_surge scenario drives N3 rx drops to 5% of packet rate.
  - name: port_dropped_count
    selector: '{job="upf"}'
    rules:
      zscore:
        enabled: true
        threshold: 2.0       # drops are always serious — lower threshold
        severity: critical

# ── Tier 3 Predictive Forecasting ────────────────────────────────────────────
# OLS linear-regression trend extrapolation. Fires BEFORE reactive rules trigger,
# giving operators advance warning before a breach occurs.
#
# Dedup window = horizon/2 = 30m: at most one predictive event per metric per 30m.
forecast:
  enabled: true
  window: 30m    # OLS lookback; must have enough data for a reliable fit
  horizon: 1h    # how far ahead to project; dedup suppresses re-fire for horizon/2

  targets:
    # Per-node PDU session count vs per-node capacity ceiling.
    # pfcp_sessions_total is a GAUGE (active sessions right now).
    # Observed: diurnal ~8.2k-15.9k normal; typical spike ~48k; worst-case
    # (diurnal peak + spike) ~64k. Capacity at 50k sits just under typical
    # spike (fires "high" early) but under the worst-case breach.
    - metric: pfcp_sessions_total
      promql: 'pfcp_sessions_total{job="upf"}'
      capacity: 50000          # typical spike ~48k sits at 96% of this
      severity: high

    # Cluster-wide session count — sum across all UPF nodes (currently a
    # single simulated node, so this equals the per-node value; kept as a
    # separate, higher threshold so a worst-case spike still staggers:
    # per-node "high" fires first, cluster "critical" only on worst-case).
    - metric: pfcp_sessions_total_cluster
      promql: 'sum(pfcp_sessions_total{job="upf"})'
      capacity: 65000          # only the diurnal-peak+spike worst case (~64k) nears this
      severity: critical

    # N3 inbound throughput vs link capacity.
    # port_bytes_count is a COUNTER — rate() to get bytes/s.
    # Observed rates: baseline ~9.9-19.1 MB/s; typical spike ~57.6 MB/s;
    # worst-case ~76.4 MB/s.
    - metric: port_bytes_count
      promql: 'sum(rate(port_bytes_count{job="upf",iface="N3",dir="rx"}[5m]))'
      capacity: 75000000       # 75 MB/s; typical spike sits at 77%, worst-case breaches
      severity: high

    # Packet drop rate acceleration — fire when the drop rate has a positive OLS slope.
    # port_dropped_count is a COUNTER — rate() converts it to drops/s.
    # accel_only: any positive slope in the drop rate deserves early attention.
    - metric: port_dropped_count
      promql: 'sum(rate(port_dropped_count{job="upf"}[2m]))'
      capacity: 0
      accel_only: true
      severity: medium
