# Detection rule configuration for the upf-detector service.
# Mounted read-only at /etc/detection/rules.yml inside the container.
# Restart the detection service after changes: docker compose restart detection

polling_interval: 60s
window: 30m   # rolling window used by zscore and trend rules

metrics:

  # PFCP session count — primary capacity metric.
  # sim baseline: ~12k sessions (diurnal ±30%); session_spike scenario 4×: ~48k
  - name: pfcp_sessions_total
    selector: '{job="upf"}'
    rules:
      zscore:
        enabled: true
        threshold: 2.5       # 4× spike ≈ z-score > 100 vs baseline; fires on first spike sample
        severity: high
      trend:
        enabled: true
        deviation_threshold: 0.20
        severity: medium
      threshold:
        max: 20000           # diurnal peak ~15.6k (12k × 1.3); spike hits ~48k
        severity: critical

  # Per-interface byte throughput — gauge (bytes/s, not cumulative).
  # sim: N3 rx ≈ 14.4 MB/s baseline; session_spike → 57.6 MB/s
  - name: port_bytes_count
    selector: '{job="upf"}'
    rules:
      zscore:
        enabled: true
        threshold: 2.5
        severity: high
      trend:
        enabled: true
        deviation_threshold: 0.25
        severity: medium

  # Per-interface packet drop rate — gauge (drops/s).
  # packet_drop_surge scenario drives N3 rx drops to 5% of packet rate.
  - name: port_dropped_count
    selector: '{job="upf"}'
    rules:
      zscore:
        enabled: true
        threshold: 2.0       # drops are always serious — lower threshold
        severity: critical

# ── Tier 3 Predictive Forecasting ────────────────────────────────────────────
# OLS linear-regression trend extrapolation. Fires BEFORE reactive rules trigger,
# giving operators advance warning before a breach occurs.
#
# Timing advantage in session_spike scenario:
#   Tier 3 (forecast_linear): fires within minutes of spike start
#   Tier 1 (zscore/threshold): fires on the first spike sample
#
# Dedup window = horizon/2 = 30m: at most one predictive event per metric per 30m.
forecast:
  enabled: true
  window: 30m    # OLS lookback; must have enough data for a reliable fit
  horizon: 1h    # how far ahead to project; dedup suppresses re-fire for horizon/2

  targets:
    # PDU session count vs capacity ceiling
    # Normal peak ~15.6k; threshold at 18k fires as spike trend rises through it
    - metric: pfcp_sessions_total
      promql: 'pfcp_sessions_total{job="upf"}'
      capacity: 18000
      severity: high

    # N3 inbound throughput vs link capacity
    # Normal ~14.4 MB/s; spike reaches ~57.6 MB/s; warn at 40 MB/s
    - metric: port_bytes_count
      promql: 'sum(port_bytes_count{job="upf",iface="N3",dir="rx"})'
      capacity: 40000000
      severity: high

    # Packet drop rate acceleration — fire when drop rate is trending up
    - metric: port_dropped_count
      promql: 'sum(port_dropped_count{job="upf"})'
      capacity: 0
      accel_only: true      # positive slope = accelerating drops; fire regardless of threshold
      severity: medium
