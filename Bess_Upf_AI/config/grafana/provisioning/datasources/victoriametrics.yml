apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    basicAuth: true
    basicAuthUser: ${VM_AUTH_USERNAME}
    secureJsonData:
      basicAuthPassword: ${VM_AUTH_PASSWORD}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
