global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: bess-upf
    env:     production

# ── Remote write to VictoriaMetrics ──────────────────────────────────────────
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    name: victoriametrics

    basic_auth:
      username: vmadmin
      password: localdev123

    queue_config:
      capacity: 10000
      max_shards: 4
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 5s

    write_relabel_configs:
      - source_labels: [imsi]
        action: drop
        regex: .+

      - source_labels: [__name__]
        action: keep
        regex: .*

      - regex: subscriber_.*
        action: labeldrop

      - regex: ue_ip
        action: labeldrop

# ── Scrape jobs ───────────────────────────────────────────────────────────────

scrape_configs:

  # UPF endpoints via file_sd (physical + simulator targets).
  - job_name: upf_standard
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label:  instance
      - target_label: job
        replacement:  upf

  - job_name: upf_custom
    static_configs:
      - targets: []
    relabel_configs:
      - target_label: job
        replacement:  upf_custom

  # Self-monitoring: Prometheus scrapes itself.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── BESS-UPF internal services ─────────────────────────────────────────────
  # These services expose /metrics via prometheus/client_golang on the same
  # port as their API. No separate exporter process needed.

  - job_name: detection
    static_configs:
      - targets: ['detection:8081']
    metrics_path: /metrics

  - job_name: analysis
    static_configs:
      - targets: ['analysis:8082']
    metrics_path: /metrics
