# Simulated UPF scrape target — generated by upf-sim service.
# This is picked up automatically by the file_sd job in prometheus.yml.
# The job adds job="upf" so detection rules and LLM allowlist treat it
# identically to real UPF targets.
- targets:
    - "upf-sim:8090"
  labels:
    upf_id: sim-upf-01
    site:   sim
    vendor: bess-sim
