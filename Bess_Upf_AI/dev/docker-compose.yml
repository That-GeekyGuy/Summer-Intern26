---
# Dev / simulator services — NOT for production deployment.
#
# Adds three services that are only useful when testing locally without a real UPF:
#   prometheus  — internal Prometheus that scrapes upf-sim
#   upf-sim     — carrier-grade 5G UPF metrics simulator with scenario API
#   grafana     — pre-provisioned dashboards over VictoriaMetrics
#
# Usage:
#   # Start core stack first (main docker-compose.yml), then:
#   docker compose -f dev/docker-compose.yml up -d
#
#   # Or start everything at once from the repo root:
#   docker compose -f docker-compose.yml -f dev/docker-compose.yml up -d
#
# Networks: joins the same named networks as the core stack.
# The core stack must be running first so the networks exist.

networks:
  metrics-backend:
    name: bess-upf-backend
    external: true    # created by main docker-compose.yml

  scrape-net:
    name: bess-upf-scrape
    external: true    # created by main docker-compose.yml

volumes:
  prometheus-data:
  grafana-data:

services:

  # ── UPF metrics simulator ───────────────────────────────────────────────────
  # Exposes realistic time-varying UPF metrics on :8090/metrics.
  # Prometheus scrapes it via file_sd (config/prometheus/targets/sim-targets.yml).
  # Scenario engine: POST /scenario {"mode":"session_spike","duration":"10m"}

  upf-sim:

    build:
      context: ./upf-sim
      dockerfile: Dockerfile

    environment:
      NODE_ID:           ${SIM_NODE_ID:-sim-upf-01}
      BASE_SESSIONS:     ${SIM_BASE_SESSIONS:-1000000}
      BYTES_PER_SESSION: ${SIM_BYTES_PER_SESSION:-5000}
      SPIKE_MULTIPLIER:  ${SIM_SPIKE_MULTIPLIER:-4.0}
      RAMP_SECONDS:      ${SIM_RAMP_SECONDS:-120}

    volumes:
      - ./upf-sim/config/scenarios-example.yml:/config/scenarios.yml:ro

    networks:
      - scrape-net    # Prometheus scrapes it here

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M


  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Scrapes upf-sim, remote-writes to VictoriaMetrics.
  # Set PROM_SCRAPE_TARGET=prometheus:9090 in .env (the default) when using this.

  prometheus:

    image: prom/prometheus:v2.52.0

    user: "65534:65534"   # nobody:nobody — non-root

    read_only: true

    tmpfs:
      - /tmp

    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-24h}
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
      - --log.level=info

    environment:
      - VM_AUTH_USERNAME=${VM_AUTH_USERNAME}
      - VM_AUTH_PASSWORD=${VM_AUTH_PASSWORD}

    networks:
      - metrics-backend   # remote_write to VictoriaMetrics
      - scrape-net        # scrape upf-sim

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M


  # ── Grafana (metrics dashboards) ────────────────────────────────────────────
  # Provisioned with VictoriaMetrics datasource and BESS-UPF observability dashboard.
  # Accessed via Caddy at /grafana/ — no direct port exposure.

  grafana:

    image: grafana/grafana:11.0.0

    environment:
      GF_SERVER_ROOT_URL:        "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER:    ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP:    "false"
      VM_AUTH_USERNAME:          ${VM_AUTH_USERNAME}
      VM_AUTH_PASSWORD:          ${VM_AUTH_PASSWORD}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro

    networks:
      - metrics-backend

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
