---
# Shared networks and volumes for the BESS-UPF stack.
# Always included first: docker compose -f docker-compose.base.yml -f docker-compose.core.yml -f docker-compose.ml.yml

networks:
  metrics-backend:
    name: bess-upf-backend
    driver: bridge
    internal: true   # containers on this network cannot initiate external connections

  scrape-net:
    name: bess-upf-scrape
    driver: bridge   # VictoriaMetrics uses this to reach external/dev Prometheus

  public-net:
    name: bess-upf-public
    driver: bridge   # Caddy's egress to the host; non-internal so Docker publishes ports 9080/443

volumes:
  victoriametrics-data:
  minio-data:
  caddy-data:
  caddy-config:
  detection-data:
  analysis-data:
  vllm-cache:
  models-data:     # shared between ml-infer (read) and training runs (write)
  hf-cache:        # HuggingFace model cache — avoids re-downloading MOMENT/Chronos on restart
