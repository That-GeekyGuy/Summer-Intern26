---
# Core always-on services: metrics store, object store, proxy, detection, analysis, frontend.
# Requires: docker-compose.base.yml (networks + volumes)

services:

  # ── VictoriaMetrics (vmsingle) ─────────────────────────────────────────────
  # NOTE: credentials appear in process args (visible via `docker inspect`).
  # For Kubernetes, mount these as env vars from a K8s Secret and pass via
  # an entrypoint wrapper; see README § Kubernetes migration notes.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    # host.docker.internal resolves to the Docker host's LAN IP on Linux.
    # Required when PROM_SCRAPE_TARGET=host.docker.internal:<port> (Prometheus on same machine).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
      - ./config/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    environment:
      - PROM_SCRAPE_TARGET=${PROM_SCRAPE_TARGET:-prometheus:9090}
    command:
      - -storageDataPath=/victoria-metrics-data
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -retentionPeriod=${VM_RETENTION:-12}
      - -httpListenAddr=0.0.0.0:8428
      - -httpAuth.username=${VM_AUTH_USERNAME}
      - -httpAuth.password=${VM_AUTH_PASSWORD}
      - -storage.minFreeDiskSpaceBytes=1073741824
      - -search.maxQueryDuration=60s
      - -search.maxConcurrentRequests=16
      - -memory.allowedPercent=60
      - -loggerLevel=INFO
    networks:
      - metrics-backend
      - scrape-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  # ── MinIO (S3-compatible object store) ─────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    networks:
      - metrics-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # ── MinIO bootstrap ─────────────────────────────────────────────────────────
  # Runs once: creates the export bucket and a least-privilege service account.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_EXPORTER_USER: ${MINIO_EXPORTER_USER}
      MINIO_EXPORTER_PASSWORD: ${MINIO_EXPORTER_PASSWORD}
      EXPORT_BUCKET: ${EXPORT_BUCKET:-upf-metrics}
    volumes:
      - ./scripts/minio-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - metrics-backend
    restart: on-failure

  # ── Parquet export job ──────────────────────────────────────────────────────
  export-job:
    build:
      context: ./export-job
      dockerfile: Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      VM_URL: http://victoriametrics:8428
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_EXPORTER_USER}
      MINIO_SECRET_KEY: ${MINIO_EXPORTER_PASSWORD}
      MINIO_BUCKET: ${EXPORT_BUCKET:-upf-metrics}
      MINIO_USE_SSL: "false"
      EXPORT_LOOKBACK: ${EXPORT_LOOKBACK:-24h}
      EXPORT_METRICS: ${EXPORT_METRICS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./config/export/crontab:/etc/supercronic/crontab:ro
    networks:
      - metrics-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 64M

  # ── Anomaly detection service ───────────────────────────────────────────────
  detection:
    build:
      context: ./detection
      dockerfile: Dockerfile
    depends_on:
      - victoriametrics
    environment:
      VM_URL: http://victoriametrics:8428
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}
      RULES_FILE: /etc/detection/rules.yml
      POLL_INTERVAL: ${DETECTION_POLL_INTERVAL:-60s}
      WINDOW: ${DETECTION_WINDOW:-30m}
      RETENTION_DAYS: ${DETECTION_RETENTION_DAYS:-30}
      DB_PATH: /data/anomalies.db
      ML_INFER_URL: ${ML_INFER_URL:-http://ml-infer:8080}
      MOMENT_URL: ${MOMENT_URL:-http://moment-sidecar:8083}
      CHRONOS_URL: ${CHRONOS_URL:-http://chronos-sidecar:8084}
      ANALYSIS_URL: ${ANALYSIS_URL:-http://analysis:8082}
      MODELS_DIR: /models
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_RESOLUTION_WINDOW: ${NOTIFY_RESOLUTION_WINDOW:-5m}
    volumes:
      - ./config/detection/rules.yml:/etc/detection/rules.yml:ro
      - detection-data:/data
      - ./models:/models:ro
    networks:
      - metrics-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # ── LLM analysis service ────────────────────────────────────────────────────
  # Go backend: agentic tool-calling loop over vLLM, PromQL validator, anomaly
  # client, RAG retriever, per-IP rate limiter, and SQLite audit log.
  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    depends_on:
      - victoriametrics
      - detection
      - vllm
      - stl-sidecar
    environment:
      VM_URL: http://victoriametrics:8428
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      DETECTION_URL: ${DETECTION_URL:-http://detection:8081}
      SIM_URL: ${SIM_URL:-http://upf-sim:8090}
      ANALYSIS_AUTH_USER: ${ANALYSIS_AUTH_USER}
      ANALYSIS_AUTH_PASSWORD: ${ANALYSIS_AUTH_PASSWORD}
      MAX_QUERY_RANGE: ${MAX_QUERY_RANGE:-720h}
      MIN_STEP: ${MIN_STEP:-15s}
      ALLOWLIST_REFRESH_INTERVAL: ${ALLOWLIST_REFRESH_INTERVAL:-5m}
      SESSION_TTL: ${SESSION_TTL:-30m}
      DB_PATH: /data/audit.db
      RAG_DOCS_DIR: /docs
      STL_URL: ${STL_URL:-http://stl-sidecar:8085}
      MODELS_DIR: /models
    volumes:
      - analysis-data:/data
      - ./analysis/docs:/docs:ro
      - ./models:/models:ro
    networks:
      - metrics-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  # ── React frontend ──────────────────────────────────────────────────────────
  # Vite-built static assets served by nginx. All traffic enters through Caddy.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - metrics-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M

  # ── Caddy (TLS-terminating reverse proxy) ──────────────────────────────────
  # The only service that publishes ports to the host.
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "9080:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_HOSTNAME: ${CADDY_HOSTNAME:-localhost}
      CADDY_ADMIN_USER: ${CADDY_ADMIN_USER:-admin}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/server.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/server.key}
    networks:
      - metrics-backend
      - public-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
