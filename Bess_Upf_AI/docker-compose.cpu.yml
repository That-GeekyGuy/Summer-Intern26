# CPU override — replaces vLLM with Ollama when no NVIDIA GPU is available.
#
# Usage (set by scripts/start.sh automatically):
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# Ollama exposes the same OpenAI-compatible API as vLLM (/v1/chat/completions)
# but runs quantized models on CPU. Slower than GPU but fully functional.
#
# Default model: qwen2.5:3b (~2 GB RAM, reasonable CPU latency ~10-30s/response)
# Change OLLAMA_MODEL in .env for a larger model if you have more RAM:
#   qwen2.5:7b  (~4 GB)
#   qwen2.5:14b (~8 GB)

services:
  vllm:
    image: ollama/ollama:latest
    runtime: ""       # no nvidia runtime needed
    ipc: ""
    entrypoint: ["/bin/ollama"]
    command: ["serve"]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: /root/.ollama/models
    volumes:
      - vllm-cache:/root/.ollama   # reuse same volume — model cached across restarts
    networks:
      - metrics-backend
      - public-net                 # needs internet to pull model on first start
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-6G}
          cpus: "${OLLAMA_CPU_LIMIT:-4}"

  analysis:
    environment:
      VLLM_URL: "http://vllm:11434"          # Ollama port
      VLLM_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
