# GPU override for vLLM — apply on top of docker-compose.yml when an NVIDIA GPU is present.
#
# Usage (set by scripts/start.sh automatically):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# VRAM tiers (scripts/start.sh sets VLLM_MODEL / VLLM_MAX_MODEL_LEN automatically):
#   8–12 GB  → Qwen/Qwen3-8B   INT4  --max-model-len 3200
#  13–23 GB  → Qwen/Qwen3-8B   FP16  --max-model-len 8192
#  24+ GB    → Qwen/Qwen3-14B  FP16  --max-model-len 8192

services:
  vllm:
    runtime: nvidia
    ipc: host          # required for tensor-parallel shared memory
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 20G
