version: "3.8"

networks:
  v2-net:
    driver: bridge

volumes:
  redpanda-data:
  ray-data:
  clickhouse-data:
  bytewax-data:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - v2-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5

  serve:
    build:
      context: ./serve
      dockerfile: Dockerfile
    environment:
      - MODELS_DIR=/models
      - KAFKA_BROKER=redpanda:9092
      - SHADOW_TOPIC=upf.shadow.detections
    volumes:
      - ./models:/models:ro
    networks:
      - v2-net
    ports:
      - "8000:8000"

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=redpanda:9092
      - RAY_SERVE_URL=http://serve:8000
      - BYTEWAX_CHECKPOINT_DIR=/data/bytewax-checkpoint
      - SCRAPE_INTERVAL_SECS=1.0
    volumes:
      - bytewax-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - v2-net

  mitigation:
    build:
      context: ./mitigation
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - v2-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-chuser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localdev123}
      CLICKHOUSE_DB: bess_upf
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:8123:8123"
    networks:
      - v2-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
