---

# BESS-UPF Metrics Pipeline

# Topology:

#   scrape-net  (internet-accessible): Prometheus â†’ physical UPF targets

#   metrics-backend (internal: true):  Prometheus â†’ VictoriaMetrics

#                                       export-job â†’ VictoriaMetrics + MinIO

#                                       Caddy â†’ VictoriaMetrics + MinIO (proxied)

#

# Only Caddy publishes ports to the host. All other services are reachable

# solely within metrics-backend.



networks:

  metrics-backend:
    name: bess-upf-backend
    driver: bridge
    internal: true   # containers on this network cannot initiate external connections

  scrape-net:
    name: bess-upf-scrape
    driver: bridge   # VictoriaMetrics uses this to reach external/dev Prometheus

  public-net:
    name: bess-upf-public
    driver: bridge   # Caddy's egress to the host; non-internal so Docker publishes ports 80/443



volumes:

  victoriametrics-data:

  minio-data:

  caddy-data:

  caddy-config:

  detection-data:

  analysis-data:

  vllm-cache:

  models-data:         # shared between ml-infer (read) and training runs (write)

  hf-cache:            # HuggingFace model cache — avoids re-downloading MOMENT/Chronos on restart



services:



  # ── VictoriaMetrics (vmsingle) â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # NOTE: credentials appear in process args (visible via `docker inspect`).

  # For Kubernetes, mount these as env vars from a K8s Secret and pass via

  # an entrypoint wrapper; see README Â§ Kubernetes migration notes.

  victoriametrics:

    image: victoriametrics/victoria-metrics:v1.101.0

    # user override removed: Docker named volumes are root-owned on first creation,

    # so an explicit non-root UID causes FATAL permission denied on flock.lock.

    # VM already drops privileges internally after opening its data directory.

    volumes:

      - victoriametrics-data:/victoria-metrics-data

      - ./config/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro

    environment:

      - PROM_SCRAPE_TARGET=${PROM_SCRAPE_TARGET:-prometheus:9090}

    command:

      - -storageDataPath=/victoria-metrics-data

      - -promscrape.config=/etc/victoriametrics/scrape.yml

      - -retentionPeriod=${VM_RETENTION:-12}

      - -httpListenAddr=0.0.0.0:8428

      - -httpAuth.username=${VM_AUTH_USERNAME}

      - -httpAuth.password=${VM_AUTH_PASSWORD}

      - -storage.minFreeDiskSpaceBytes=1073741824   # refuse writes if < 1 GiB free

      - -search.maxQueryDuration=60s

      - -search.maxConcurrentRequests=16

      - -memory.allowedPercent=60       # cap VM's in-process cache

      - -loggerLevel=INFO

    networks:

      - metrics-backend

      - scrape-net      # federation scrape — reaches prometheus:9090 (dev) or external host (prod)

    restart: unless-stopped

    deploy:

      resources:

        limits:

          cpus: "2.0"

          memory: 2G

        reservations:

          memory: 512M



  # â"€â"€ MinIO (S3-compatible object store) â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  minio:

    image: minio/minio:RELEASE.2024-05-10T01-41-38Z

    # MinIO manages its own internal user; overriding with an arbitrary UID

    # causes "file access denied" on the data volume (volume is root-owned on

    # first creation). Remove the user override and let MinIO use its default.

    volumes:

      - minio-data:/data

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address :9001

    networks:

      - metrics-backend

    restart: unless-stopped

    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]

      interval: 15s

      timeout: 10s

      retries: 5

      start_period: 30s

    deploy:

      resources:

        limits:

          cpus: "1.0"

          memory: 1G

        reservations:

          memory: 256M



  # â"€â"€ MinIO bootstrap â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Runs once: creates the export bucket and a least-privilege service account.

  # Exits 0 on success; the export-job depends on it completing successfully.

  minio-init:

    image: minio/mc:latest

    depends_on:

      minio:

        condition: service_healthy

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      MINIO_EXPORTER_USER: ${MINIO_EXPORTER_USER}

      MINIO_EXPORTER_PASSWORD: ${MINIO_EXPORTER_PASSWORD}

      EXPORT_BUCKET: ${EXPORT_BUCKET:-upf-metrics}

    volumes:

      - ./scripts/minio-init.sh:/init.sh:ro

    entrypoint: ["/bin/sh", "/init.sh"]

    networks:

      - metrics-backend

    restart: on-failure   # retries if minio isn't ready yet despite healthcheck



  # â"€â"€ Parquet export job â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Runs on the schedule defined in config/export/crontab (default: daily 02:00 UTC).

  # supercronic is bundled into the image (see export-job/Dockerfile).

  export-job:

    build:

      context: ./export-job

      dockerfile: Dockerfile

    depends_on:

      minio-init:

        condition: service_completed_successfully

    environment:

      VM_URL: http://victoriametrics:8428

      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}

      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}

      MINIO_ENDPOINT: minio:9000

      MINIO_ACCESS_KEY: ${MINIO_EXPORTER_USER}

      MINIO_SECRET_KEY: ${MINIO_EXPORTER_PASSWORD}

      MINIO_BUCKET: ${EXPORT_BUCKET:-upf-metrics}

      MINIO_USE_SSL: "false"

      EXPORT_LOOKBACK: ${EXPORT_LOOKBACK:-24h}

      EXPORT_METRICS: ${EXPORT_METRICS}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:

      - ./config/export/crontab:/etc/supercronic/crontab:ro

    networks:

      - metrics-backend

    restart: unless-stopped

    deploy:

      resources:

        limits:

          cpus: "0.5"

          memory: 512M

        reservations:

          memory: 64M







  # ── vLLM model server â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Serves Qwen3-8B via the OpenAI-compatible API on :8000 (internal only).

  # Model weights are cached in the vllm-cache volume; first start downloads ~5 GB.

  # To change model params (quantization, context length) edit the command list below.

  vllm:

    image: vllm/vllm-openai:v0.7.3

    runtime: nvidia

    ipc: host                   # required for tensor-parallel shared memory

    environment:

      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}

      VLLM_USE_V1: "0"

      HF_HUB_ENABLE_HF_TRANSFER: "0"

    command:

      - --model

      - ${VLLM_MODEL:-Qwen/Qwen3-8B}

      - --quantization

      - bitsandbytes              # INT4 â€" fits in 8 GB VRAM; remove for FP16 (needs 16+ GB)

      - --load-format

      - bitsandbytes

      - --max-model-len

      - "3200"

      - --gpu-memory-utilization

      - "0.95"

      - --enable-auto-tool-choice

      - --tool-call-parser

      - hermes

      - --host

      - "0.0.0.0"

    volumes:

      - vllm-cache:/root/.cache/huggingface

    networks:

      - metrics-backend

      - public-net      # needs internet to download model weights from HuggingFace

    restart: unless-stopped

    deploy:

      resources:

        reservations:

          devices:

            - driver: nvidia

              count: 1

              capabilities: [gpu]

        limits:

          memory: 12G



  # â"€â"€ Tier 2 ML inference sidecar â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Loads trained models from models-data volume. Starts in degraded mode

  # (available=false) when models are not yet present — no crash.

  # NEVER exposed through Caddy. Internal-network only.

  # Retrain: see README "How to retrain Tier 2".

  ml-infer:

    build:

      context: ./tools

      dockerfile: Dockerfile

    environment:

      MINIO_ENDPOINT:   minio:9000

      MINIO_ACCESS_KEY: ${MINIO_EXPORTER_USER}

      MINIO_SECRET_KEY: ${MINIO_EXPORTER_PASSWORD}

      MINIO_BUCKET:     ${EXPORT_BUCKET:-upf-metrics}

      MODELS_DIR:       /models

      NODE_ID:          ${SIM_NODE_ID:-sim-upf-01}

      PORT:             "8080"

    volumes:

      - ./models:/models

    networks:

      - metrics-backend

    restart: unless-stopped

    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 20s

    deploy:

      resources:

        limits:

          cpus: "0.5"

          memory: 512M

        reservations:

          memory: 128M



  # â"€â"€ Anomaly detection service â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Polls VictoriaMetrics every DETECTION_POLL_INTERVAL, runs z-score / trend /

  # threshold rules from rules.yml, and stores events in SQLite at /data/anomalies.db.

  # Exposes GET /anomalies internally (queried by the analysis service).

  # -- Tier 2 AI: MOMENT anomaly detection sidecar ---------------------------------

  # Loads MOMENT-1-large encoder + trained reconstruction head from models-data.

  # Starts in degraded mode (available: false) when models not yet present.

  # NEVER exposed through Caddy. Internal-network only.

  # Retrain: cd tools && python train/prepare_dataset.py && python train/train_moment.py

  moment-sidecar:

    build:

      context: ./tools

      dockerfile: infer/moment/Dockerfile

    environment:

      MODEL_VARIANT:  ${MOMENT_VARIANT:-MOMENT-1-large}

      MODEL_PATH:     /models/moment_head.pt

      THRESHOLD_PATH: /models/moment_threshold.json

      CHANNEL_PATH:   /models/moment_channel_names.json

      MODELS_DIR:     /models

      HOST:           0.0.0.0

      PORT:           "8083"

      HF_HOME:        /hf-cache

    volumes:

      - ./models:/models:ro

      - hf-cache:/hf-cache

    networks:

      - metrics-backend

    restart: unless-stopped

    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]

      interval: 30s

      timeout: 15s

      retries: 3

      start_period: 60s

    deploy:

      resources:

        limits:

          memory: 4G

          cpus: "2"



  # -- Tier 2 AI: Chronos-2 forecasting sidecar ------------------------------------

  # Loads ChronosPipeline (zero-shot or fine-tuned) from models-data.

  # Starts in degraded mode when models not yet present -- uses naive baseline.

  # NEVER exposed through Caddy. Internal-network only.

  # Retrain: cd tools && python train/train_chronos.py

  chronos-sidecar:

    build:

      context: ./tools

      dockerfile: infer/chronos/Dockerfile

    environment:

      MODEL_PATH:         /models/chronos

      METADATA_PATH:      /models/chronos_metadata.json

      STL_PROFILES_PATH:  /models/stl_profiles.json

      HOST:               0.0.0.0

      PORT:               "8084"

      HF_HOME:             /hf-cache
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE:  "1"

    volumes:

      - ./models:/models:ro

      - hf-cache:/hf-cache

    networks:

      - metrics-backend

    restart: unless-stopped

    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]

      interval: 30s

      timeout: 15s

      retries: 3

      start_period: 60s

    deploy:

      resources:

        limits:

          memory: 2G

          cpus: "1"



  # -- Temporal intelligence sidecar (STL decomposition + regime classification) ---
  # Fits STL to historical CSV data at startup, serves regime forecasts and
  # calendar context. Starts in degraded mode if CSV not found (no crash).
  # NEVER exposed through Caddy. Internal-network only.
  # Refit: POST /refit (triggers background refit from CSV or VictoriaMetrics)
  # STL profiles written to /models/stl_profiles.json — loaded by chronos-sidecar
  # for long-horizon (6h) hybrid forecasting.

  stl-sidecar:

    build:

      context: ./tools/temporal

      dockerfile: Dockerfile

    environment:

      VICTORIA_METRICS_URL: http://victoriametrics:8428

      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}

      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}

      STL_PERIOD: "96"

      STL_REFIT_INTERVAL_HOURS: "24"

      HOLIDAY_COUNTRY: ${HOLIDAY_COUNTRY:-IN}

      HOLIDAY_SUBDIVISION: ${HOLIDAY_SUBDIVISION:-}

      HOST: 0.0.0.0

      PORT: "8085"

      MODELS_DIR: /models

      DATA_DIR: /data

    volumes:

      - ./models:/models

      - ./prometheus_full_export_20260622_115327.csv:/data/upf_dataset.csv:ro

    networks:

      - metrics-backend

    restart: unless-stopped

    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 60s

    deploy:

      resources:

        limits:

          memory: 1G

          cpus: "1"

        reservations:

          memory: 256M



  detection:

    build:

      context: ./detection

      dockerfile: Dockerfile

    depends_on:

      - victoriametrics

    environment:

      VM_URL: http://victoriametrics:8428

      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}

      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}

      RULES_FILE: /etc/detection/rules.yml

      POLL_INTERVAL: ${DETECTION_POLL_INTERVAL:-60s}

      WINDOW: ${DETECTION_WINDOW:-30m}

      RETENTION_DAYS: ${DETECTION_RETENTION_DAYS:-30}

      DB_PATH: /data/anomalies.db

      # Tier 3 forecasting: capacity overrides (default values are in rules.yml)

      # Tier 2 ML: sidecar URL and models directory

      ML_INFER_URL:      ${ML_INFER_URL:-http://ml-infer:8080}

      # Tier 2 AI sidecars

      MOMENT_URL:        ${MOMENT_URL:-http://moment-sidecar:8083}

      CHRONOS_URL:       ${CHRONOS_URL:-http://chronos-sidecar:8084}

      ANALYSIS_URL:      ${ANALYSIS_URL:-http://analysis:8082}

      MODELS_DIR:        /models

      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}

      NOTIFY_RESOLUTION_WINDOW: ${NOTIFY_RESOLUTION_WINDOW:-5m}

    volumes:

      - ./config/detection/rules.yml:/etc/detection/rules.yml:ro

      - detection-data:/data

      - ./models:/models:ro   # read-only: detection reads metadata.json + scaler_params.json

    networks:

      - metrics-backend

    restart: unless-stopped

    deploy:

      resources:

        limits:

          cpus: "0.5"

          memory: 256M

        reservations:

          memory: 64M



  # â"€â"€ LLM analysis service â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Go backend: agentic tool-calling loop over vLLM, PromQL validator (allowlist

  # sourced from VM), anomaly client, RAG retriever, per-IP rate limiter, and

  # SQLite audit log.  Handles its own Basic Auth â€" Caddy passes /api/* through.

  analysis:

    build:

      context: ./analysis

      dockerfile: Dockerfile

    depends_on:

      - victoriametrics

      - detection

      - vllm

      - stl-sidecar

    environment:

      VM_URL: http://victoriametrics:8428

      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME}

      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD}

      VLLM_URL: ${VLLM_URL:-http://vllm:8000}

      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}

      DETECTION_URL: ${DETECTION_URL:-http://detection:8081}

      SIM_URL: ${SIM_URL:-http://upf-sim:8090}

      ANALYSIS_AUTH_USER: ${ANALYSIS_AUTH_USER}

      ANALYSIS_AUTH_PASSWORD: ${ANALYSIS_AUTH_PASSWORD}

      MAX_QUERY_RANGE: ${MAX_QUERY_RANGE:-720h}

      MIN_STEP: ${MIN_STEP:-15s}

      ALLOWLIST_REFRESH_INTERVAL: ${ALLOWLIST_REFRESH_INTERVAL:-5m}

      SESSION_TTL: ${SESSION_TTL:-30m}

      DB_PATH: /data/audit.db

      RAG_DOCS_DIR: /docs

      STL_URL: ${STL_URL:-http://stl-sidecar:8085}

      MODELS_DIR: /models

    volumes:

      - analysis-data:/data

      - ./analysis/docs:/docs:ro

      - ./models:/models:ro

    networks:

      - metrics-backend

    restart: unless-stopped

    deploy:

      resources:

        limits:

          cpus: "1.0"

          memory: 512M

        reservations:

          memory: 128M



  # â"€â"€ React frontend â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€

  # Vite-built static assets served by nginx. Caddy routes everything not

  # matched by /vm/*, /minio/*, or /api/* here. No direct port exposure â€"

  # all traffic enters through Caddy at :443.

  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    networks:

      - metrics-backend

    restart: unless-stopped

    deploy:

      resources:

        limits:

          cpus: "0.25"

          memory: 64M

        reservations:

          memory: 16M

  # ── Caddy (TLS-terminating reverse proxy) ──────────────────────────────────────

  # The only service that publishes ports to the host.

  caddy:

    image: caddy:2.8-alpine

    ports:

      - "80:80"     # redirects to HTTPS

      - "443:443"

    volumes:

      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

      - ./certs:/certs:ro   # dev self-signed certs (see scripts/gen-dev-certs.sh)

      - caddy-data:/data

      - caddy-config:/config

    environment:

      CADDY_HOSTNAME: ${CADDY_HOSTNAME:-localhost}

      CADDY_ADMIN_USER: ${CADDY_ADMIN_USER:-admin}

      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/server.crt}

      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/server.key}

    networks:

      - metrics-backend

      - public-net

    restart: unless-stopped

    deploy:

      resources:

        limits:

          cpus: "0.25"

          memory: 128M