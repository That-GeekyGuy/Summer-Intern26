global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: tcp-listener
    static_configs:
      - targets: ["tcp-listener:2112"]

  - job_name: udp-listener
    static_configs:
      - targets: ["udp-listener:2114"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
