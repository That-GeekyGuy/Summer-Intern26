services:

  # Go URL shortener — exposes REST API and /metrics on :8080.
  shortener:
    build:
      context: .
      dockerfile: docker/Dockerfile.shortener
    ports:
      - "8080:8080"

  # Scrapes shortener:8080/metrics every 5 s; stores and evaluates rules.
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    depends_on:
      - shortener

  # Filterable JSON query layer over the raw /metrics endpoint.
  # Override METRICS_SOURCE to point at any Prometheus-format exporter.
  query-api:
    build:
      context: ./query-api
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - METRICS_SOURCE=http://shortener:8080/metrics
      - PORT=8090
    depends_on:
      - shortener

  # Polls Prometheus with PromQL every 5 s and logs results.
  # Custom query: docker compose run go-worker -config http://... -query '<promql>'
  go-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["-config", "http://prometheus:9090"]
    depends_on:
      - prometheus

  # Grafana dashboards — http://localhost:3001 (no login required)
  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # Nginx frontend — http://localhost:3002
  # /            → shortener UI  (proxies /api/* to shortener:8080)
  # /metrics.html → Prometheus metrics explorer
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - shortener
      - query-api
