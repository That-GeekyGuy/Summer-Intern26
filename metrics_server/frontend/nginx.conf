server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the shortener REST API — browser calls /api/* (same origin),
    # Nginx strips the prefix and forwards to the shortener container.
    # /api/shorten       → POST shortener:8080/shorten
    # /api/stats/{code}  → GET  shortener:8080/stats/{code}
    # /api/{code}        → GET  shortener:8080/{code}  (302 redirect to original URL)
    location /api/ {
        proxy_pass         http://shortener:8080/;
        proxy_set_header   Host $http_host;
        proxy_redirect     off;
    }
}
