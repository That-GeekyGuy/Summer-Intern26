groups:
  - name: upf_port_bytes
    rules:
      # Uplink path: UE → RAN → N3 → UPF → N6 → Internet
      # sum without(dir,iface) drops those labels so both series share the same
      # label set and the drop subtraction below can match them correctly.
      # [15s] window: reacts within one scrape cycle — suitable for alert testing.
      - record: upf:port_bytes_rx_n3:rate5m
        expr: sum without(dir, iface) (rate(port_bytes_count{dir="rx", iface="N3"}[15s]))

      - record: upf:port_bytes_tx_n6:rate5m
        expr: sum without(dir, iface) (rate(port_bytes_count{dir="tx", iface="N6"}[15s]))

      # Downlink path: Internet → N6 → UPF → N3 → RAN → UE
      - record: upf:port_bytes_rx_n6:rate5m
        expr: sum without(dir, iface) (rate(port_bytes_count{dir="rx", iface="N6"}[15s]))

      - record: upf:port_bytes_tx_n3:rate5m
        expr: sum without(dir, iface) (rate(port_bytes_count{dir="tx", iface="N3"}[15s]))

      # Bytes dropped = ingress minus egress for each direction
      - record: upf:bytes_dropped_uplink:rate5m
        expr: upf:port_bytes_rx_n3:rate5m - upf:port_bytes_tx_n6:rate5m

      - record: upf:bytes_dropped_downlink:rate5m
        expr: upf:port_bytes_rx_n6:rate5m - upf:port_bytes_tx_n3:rate5m

  - name: upf_alerts
    rules:
      - alert: HighBytesDroppedUplink
        expr: (upf:bytes_dropped_uplink:rate5m) > 524288
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High byte drop rate on UPF"
          description: >
            Uplink byte drop rate is {{ $value | humanize }}B/s,
            exceeding the 0.5 MB/s threshold. Check N3/N6 interface health.

      - alert: HighBytesDroppedDownlink
        expr: (upf:bytes_dropped_downlink:rate5m) > 524288
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High byte drop rate on UPF"
          description: >
            Downlink byte drop rate is {{ $value | humanize }}B/s,
            exceeding the 0.5 MB/s threshold. Check N3/N6 interface health.
