---
# Wires Prometheus as the default datasource on startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: default
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: false

---
# Tells Grafana where to find dashboard JSON files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: default
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards

---
# The actual dashboard — 11 panels covering every requested metric.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: default
data:
  tcp-listener.json: |
    {
      "uid": "tcp-listener",
      "title": "TCP Listener — Stress Test Monitor",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-5m", "to": "now" },
      "timezone": "browser",
      "panels": [
        {
          "id": 1, "type": "stat", "title": "CPU Usage",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[1m])) * 100)", "legendFormat": "CPU %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [{"color":"green","value":null},{"color":"yellow","value":60},{"color":"red","value":85}] },
            "color": { "mode": "thresholds" } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "id": 2, "type": "stat", "title": "RAM Usage",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100", "legendFormat": "RAM %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [{"color":"green","value":null},{"color":"yellow","value":70},{"color":"red","value":90}] },
            "color": { "mode": "thresholds" } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "id": 3, "type": "stat", "title": "Disk Usage ( / )",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "(1 - node_filesystem_free_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"}) * 100", "legendFormat": "Disk %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [{"color":"green","value":null},{"color":"yellow","value":75},{"color":"red","value":90}] },
            "color": { "mode": "thresholds" } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "id": 4, "type": "stat", "title": "CPU Temperature",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "avg(node_hwmon_temp_celsius{chip=~\".*coretemp.*|.*k10temp.*\"})", "legendFormat": "°C (hwmon)" },
            { "expr": "avg(node_thermal_zone_temp) / 1000", "legendFormat": "°C (thermal)" }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius",
            "thresholds": { "mode": "absolute", "steps": [{"color":"blue","value":null},{"color":"green","value":40},{"color":"yellow","value":70},{"color":"red","value":90}] },
            "color": { "mode": "thresholds" } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "id": 5, "type": "timeseries", "title": "CPU Usage Over Time",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 - (avg by(cpu)(rate(node_cpu_seconds_total{mode=\"idle\"}[30s])) * 100)", "legendFormat": "core {{cpu}}" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },
        {
          "id": 6, "type": "timeseries", "title": "RAM Usage Over Time",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes", "legendFormat": "Used" },
            { "expr": "node_memory_MemAvailable_bytes", "legendFormat": "Available" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },
        {
          "id": 7, "type": "timeseries", "title": "Network Bandwidth (bytes/s)",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(node_network_receive_bytes_total{device!=\"lo\"}[30s]))", "legendFormat": "Receive" },
            { "expr": "sum(rate(node_network_transmit_bytes_total{device!=\"lo\"}[30s]))", "legendFormat": "Transmit" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },
        {
          "id": 8, "type": "timeseries", "title": "Network Packets/s",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(node_network_receive_packets_total{device!=\"lo\"}[30s]))", "legendFormat": "RX packets/s" },
            { "expr": "sum(rate(node_network_transmit_packets_total{device!=\"lo\"}[30s]))", "legendFormat": "TX packets/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "pps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi" } }
        },
        {
          "id": 9, "type": "timeseries", "title": "TCP Active Connections",
          "gridPos": { "x": 0, "y": 20, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "tcp_connections_active", "legendFormat": "active" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0,
            "color": { "fixedColor": "blue", "mode": "fixed" },
            "custom": { "lineWidth": 2, "fillOpacity": 20 } } }
        },
        {
          "id": 10, "type": "timeseries", "title": "Connections/s vs Rejections/s",
          "gridPos": { "x": 8, "y": 20, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(tcp_connections_total[30s])", "legendFormat": "handled/s" },
            { "expr": "rate(tcp_connections_rejected_total[30s])", "legendFormat": "rejected/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0, "custom": { "lineWidth": 2, "fillOpacity": 10 } },
            "overrides": [{ "matcher": { "id": "byName", "options": "rejected/s" },
              "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }] },
          "options": { "tooltip": { "mode": "multi" } }
        },
        {
          "id": 11, "type": "timeseries", "title": "Avg Handling Latency (ms)",
          "gridPos": { "x": 16, "y": 20, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "rate(tcp_request_duration_ms_sum[30s]) / rate(tcp_connections_total[30s])", "legendFormat": "avg latency ms" }],
          "fieldConfig": { "defaults": { "unit": "ms", "min": 0,
            "color": { "fixedColor": "orange", "mode": "fixed" },
            "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
