apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-listener
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcp-listener
  template:
    metadata:
      labels:
        app: tcp-listener
    spec:
      containers:
        - name: listener
          image: xtremevoid/tcp-listener:v3   # rebuilt with /metrics endpoint on :2112
          imagePullPolicy: IfNotPresent        # use local image if present (minikube build)
          ports:
            - name: tcp
              containerPort: 8080
            - name: metrics
              containerPort: 2112
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
