apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-listener
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcp-listener
  template:
    metadata:
      labels:
        app: tcp-listener
    spec:
      containers:
        - name: listener
          image: xtremevoid/tcp-listener:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
